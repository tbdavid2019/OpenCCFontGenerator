services:
  opencc-font-web:
    image: ${OPENCC_WEB_IMAGE:-ghcr.io/tbdavid2019/openccfontgenerator:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencc-font-generator-web
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=opencc-font"
    ports:
      # Bound to loopback by default for reverse-proxy deployments (Nginx / Caddy / Cloudflare Tunnel).
      # Set OPENCC_WEB_BIND_PORT=8000:8000 if exposing directly without a local proxy.
      - "${OPENCC_WEB_BIND_PORT:-127.0.0.1:8000:8000}"
    environment:
      TMPDIR: /data/tmp
      OPENCC_WEB_STORAGE_DIR: /data/jobs
      OPENCC_WEB_MAX_FILE_MB: "80"
      OPENCC_WEB_MAX_TOTAL_UPLOAD_MB: "240"
      OPENCC_WEB_MAX_EXTRACTED_MB: "320"
      # 1 worker is recommended with mem_limit: 4g (large CJK + fallback jobs can peak at 2.5-3.5 GB); raise mem_limit to 6g-8g for 2
      OPENCC_WEB_MAX_CONCURRENT_JOBS: "${OPENCC_WEB_MAX_CONCURRENT_JOBS:-1}"
      OPENCC_WEB_MAX_CONCURRENT_UPLOADS: "${OPENCC_WEB_MAX_CONCURRENT_UPLOADS:-4}"
      OPENCC_WEB_MAX_QUEUED_JOBS: "20"
      OPENCC_WEB_MIN_FREE_MB: "${OPENCC_WEB_MIN_FREE_MB:-512}"
      OPENCC_WEB_JOB_TTL_SECONDS: "7200"
      OPENCC_WEB_JOB_TIMEOUT_SECONDS: "600"
      OPENCC_WEB_RATE_LIMIT_PER_MIN: "12"
      # Security default: keep false unless running behind a trusted reverse proxy and set OPENCC_WEB_TRUSTED_PROXIES
      OPENCC_WEB_TRUST_PROXY_HEADERS: "${OPENCC_WEB_TRUST_PROXY_HEADERS:-false}"
      OPENCC_WEB_TRUSTED_PROXIES: "${OPENCC_WEB_TRUSTED_PROXIES:-}"
      # Restrict to your production origin(s) (e.g. https://fonts.example.com) before public exposure
      OPENCC_WEB_CORS_ORIGINS: "${OPENCC_WEB_CORS_ORIGINS:-*}"
    volumes:
      - opencc_font_jobs:/data
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    read_only: true
    cap_drop:
      - ALL
    mem_limit: 4g
    cpus: "2.0"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Note: Keep Uvicorn single-process (workers=1) because JobManager and SlidingWindowRateLimiter hold state in memory.
    # If placing behind Nginx / Caddy / Cloudflare, set client_max_body_size >= 250M
    # and proxy_read_timeout >= 300s (job submission returns 202 immediately, while big uploads may take ~30s).

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: opencc-font-watchtower
    profiles: ["watchtower"]
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_JSON:-/dev/null}:/config.json:ro
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: opencc-font
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-3600}"
      WATCHTOWER_TIMEOUT: "60s"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      TZ: Asia/Taipei

volumes:
  opencc_font_jobs:
