name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Syntax, OpenCC Cache & Unit/API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt

      - name: Cache compiled otfcc v0.10.4 binaries
        id: otfcc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/otfcc-0.10.4
          key: otfcc-0.10.4-linux-amd64-v1

      - name: Build otfccdump and otfccbuild from verified source
        if: steps.otfcc-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang binutils
          mkdir -p /tmp/otfcc-build ~/.local/otfcc-0.10.4/bin
          cd /tmp/otfcc-build
          curl -fsSL -o otfcc.tar.gz "https://github.com/caryll/otfcc/archive/refs/tags/v0.10.4.tar.gz"
          echo "d9c74825ddac700eb429de31de7cb0a249636f47c6a4cc64eaa102a40966cf00  otfcc.tar.gz" | sha256sum -c -
          tar -xzf otfcc.tar.gz
          cd otfcc-0.10.4
          mkdir -p out
          export CFLAGS="-std=gnu11 -O2 -DNDEBUG -D_CARYLL_USE_PRE_SERIALIZED -DMAIN_VER=0 -DSECONDARY_VER=10 -DPATCH_VER=4 -fPIC -Wno-multichar -Wno-unused-const-variable"
          find dep/extern -name '*.c' | sort | nl -n rz -w 4 | xargs -n 2 -P "$(nproc)" sh -c 'clang $CFLAGS -Iinclude -Iinclude/dep -c "$2" -o "out/dep_${1}.o"' _
          find lib -name '*.c' | sort | nl -n rz -w 4 | xargs -n 2 -P "$(nproc)" sh -c 'clang $CFLAGS -Iinclude -Ilib -c "$2" -o "out/lib_${1}.o"' _
          clang $CFLAGS -Iinclude -Ilib -c src/stopwatch.c -o out/stopwatch.o
          clang $CFLAGS -Iinclude -Ilib -c src/otfccdump.c -o out/otfccdump.o
          clang $CFLAGS -Iinclude -Ilib -c src/otfccbuild.c -o out/otfccbuild.o
          ar rcs out/libotfcc.a out/dep_*.o out/lib_*.o
          clang -fPIC out/otfccdump.o out/stopwatch.o out/libotfcc.a -lm -o out/otfccdump
          clang -fPIC out/otfccbuild.o out/stopwatch.o out/libotfcc.a -lm -o out/otfccbuild
          strip out/otfccdump out/otfccbuild
          install -m 0755 out/otfccdump ~/.local/otfcc-0.10.4/bin/otfccdump
          install -m 0755 out/otfccbuild ~/.local/otfcc-0.10.4/bin/otfccbuild
          rm -rf /tmp/otfcc-build

      - name: Expose otfcc binaries in PATH
        run: |
          echo "$HOME/.local/otfcc-0.10.4/bin" >> "$GITHUB_PATH"
          "$HOME/.local/otfcc-0.10.4/bin/otfccdump" --version
          "$HOME/.local/otfcc-0.10.4/bin/otfccbuild" --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools pyyaml
          pip install -r requirements.txt -r requirements-web.txt

      - name: Build OpenCC 1.4.2 cache tables
        run: python setup.py build

      - name: Run syntax, YAML, OpenCC cache, and unit/API tests
        run: |
          bash -n run.sh run90.sh runSTATIC.sh runVF.sh runWEBFONT.sh
          node --check src/OpenCCFontGenerator/web/static/app.js
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml')); yaml.safe_load(open('.github/workflows/ci-cd.yml'))"
          python -m py_compile src/OpenCCFontGenerator/*.py src/OpenCCFontGenerator/web/*.py tests/*.py
          PYTHONPATH=src python .agents/skills/opencc-dict-upgrade/scripts/verify_opencc_upgrade.py --expected-version 1.4.2
          PYTHONPATH=src python -m unittest discover -s tests -v

  build-and-push:
    name: Build & Publish Multi-Arch Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
